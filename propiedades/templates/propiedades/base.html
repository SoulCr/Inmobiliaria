{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Inmobiliaria{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'propiedades/css/estilo.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-dark barra">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'propiedades:listado' %}">Inmobiliaria</a>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% for m in messages %}
      <div class="alert alert-success" role="alert">{{ m }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie py-3 mt-auto">
    <div class="container small">© Inmobiliaria</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
