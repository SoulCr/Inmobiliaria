<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Inmobiliaria{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f4; color: #1c1917; }
    header { background: #1c1917; padding: 1rem 2rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; font-size: 1.2rem; }
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    .filtros { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filtros input, .filtros select, .filtros button { padding: .5rem; border: 1px solid #d6d3d1; border-radius: 6px; }
    .filtros button { background: #1c1917; color: #fff; cursor: pointer; }
    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .card { background: #fff; border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .sin-foto { height: 180px; background: #e7e5e4; display: flex; align-items: center; justify-content: center; color: #78716c; }
    .info { padding: 1rem; }
    .info h3 { margin: .3rem 0; }
    .precio { font-weight: 700; font-size: 1.1rem; }
    .etiqueta { font-size: .85rem; color: #78716c; }
  </style>
</head>
<body>
  <header><a href="{% url 'propiedades:listado' %}">Inmobiliaria</a></header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
